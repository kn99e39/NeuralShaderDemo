  blend_file: "../../results/batch1_hq_dynamic_failure/cloth/static/canonical_rain_garments_aovs.blend"
  checkpoint: "CHECKPOINT_SUPPLIED_BY_CLI"
  resolution: [512, 512]
  aa_samples: 1
